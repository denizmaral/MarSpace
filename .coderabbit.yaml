# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings for MarSpace. Reference: https://docs.coderabbit.ai/reference/configuration
# CLAUDE.md is read as the coding guidelines (knowledge_base.code_guidelines), so the
# path instructions below only say what to look at hardest; they don't repeat it.

language: en-US
tone_instructions: Senior Swift 6.4 reviewer. Be direct and concise; report real defects, performance and memory costs first; skip praise and restating the diff.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    # Generated by ./generate.sh, never edited by hand.
    - "!Sources/Common/cmdHelpGenerated.swift"
    - "!Sources/Cli/subcommandDescriptionsGenerated.swift"
    - "!xcode/AeroSpace.xcodeproj/**"
    - "!Package.resolved"
    # Recorded accessibility dumps used as test input.
    - "!axDumps/**"

  path_instructions:
    - path: "Sources/**/*.swift"
      instructions: |
        Review as a senior Swift 6.4 developer who cares about clean, fast and memory-light code. Prefer modern Swift
        (typed throws, noncopyable and ~Escapable types where they fit, Span over unsafe buffers, Synchronization.Mutex
        for shared mutable state instead of locks, queues or OSAllocatedUnfairLock). Prefer event-driven designs over
        polling. Point out allocations, copies, repeated system queries and O(n^2) work that a cache or a better data
        structure avoids, and retain cycles in closures and observers. Suggest a structural change when it gives a clearly
        cleaner design; don't settle for a local patch over a wrong abstraction.
        Swift 6 language mode with NonisolatedNonsendingByDefault and strictMemorySafety. Also look hard for:
        - concurrency: everything runs on @MainActor; new tasks must use Task.startUnstructured, never Task {} or Task.init;
          async functions take a CancellationMode and the _nonCancellable suffix must stay truthful;
        - fixes that special-case one app (bundle ids, app names, window titles) instead of a generic mechanism;
        - tree code that counts or iterates children where inhabitedChildren is meant (dead and invisible nodes stay in the tree);
        - invariants that should use die/check, and unsafe calls without an explicit unsafe expression;
        - work added to hot paths (refresh sessions, layout, accessibility observers) that runs per window or per event.
    - path: "Sources/AppBundle/mouse/trackpadColumnScrolling.swift"
      instructions: |
        The event tap callback sees every scroll event of every app and runs on its own thread. Keep it trivial:
        no allocation-heavy work, no main-actor hops, shared state only under its Mutex.
    - path: "Sources/AppBundle/settings/**"
      instructions: |
        Settings are edited only in the settings window (no config file, no TOML, no migration). Every settings struct must
        stay @DecodableWithDefaults so older stored settings still decode; a new option needs a Settings field, the compiler
        (Settings.compile), a control in the settings window and docs/guide.md if users need to know about it. Flag
        changes that would change the compiled result recorded in test-fixtures without updating the fixture.
    - path: "Sources/AppBundle/tree/**"
      instructions: |
        Check that tree mutations keep TreeNode binding, adaptive weights and the most-recently-used stack consistent,
        and that placement and persistence (TilingSlot, WindowPlacementStore, TilingTreeSnapshot) still round-trip.
    - path: "Sources/AppBundleTests/**"
      instructions: |
        Tests use Swift Testing: suites are @MainActor @Suite(.serializedGlobally) with init() { setUpWorkspacesForTests() }.
        setUpWorkspacesForTests turns both normalizations off, so a test that relies on them must turn them on again.
        Prefer asserting tree shape with layoutDescription. Point out behaviour changes in the PR that no test covers.
    - path: "docs/aerospace-*.adoc"
      instructions: |
        These files are the source of the generated CLI help. If usage or flags change, the generated Swift files must be
        regenerated with ./generate.sh in the same PR.
    - path: "**/*.sh"
      instructions: |
        Scripts target bash 5 via script/setup.sh. Helper and tooling scripts are written in Swift (or plain shell), never Python.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        A plain English sentence that says what changes for the user or the code, like the existing commit messages
        (e.g. "A floating window remembers its tile across restarts of MarSpace"). No conventional-commit prefixes.
    description:
      mode: warning
    issue_assessment:
      mode: "off"

  finishing_touches:
    unit_tests:
      enabled: true

  tools:
    swiftlint:
      enabled: true
      config_file: .swiftlint.yml
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    languagetool:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "CONTRIBUTING.md"
      - "dev-docs/architecture.md"
  learnings:
    scope: local
